<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT Plants Module</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary-color: #10b981;
            --card-bg: #1e293b;
            --hover-bg: #334155;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            margin-top: 5rem;
            text-align: center;
            padding: 0 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #34d399, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.25rem;
            max-width: 600px;
            margin-bottom: 3rem;
        }
        .container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            padding: 0 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 2.5rem;
            width: 280px;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #334155;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            background-color: var(--hover-bg);
            border-color: var(--primary-color);
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        h2 {
            font-size: 1.75rem;
            margin: 0 0 1rem 0;
        }
        p.desc {
            color: #cbd5e1;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>BIT Plants Module</h1>
        <p class="subtitle">Digital Twin layer, Infineon/BIT Excellence Program 2026</p>
    </header>
    
    <div class="container">
        <a href="./mockup/" class="card" style="width: 350px;">
            <div class="icon">🎨</div>
            <h2>UX Prototype (Mockup)</h2>
            <p class="desc">View the interactive throwaway prototype for the Plants Module.</p>
        </a>
    </div>
</body>
</html>
