<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plants Module — Variety Management</title>
  <meta name="description" content="Manage mango varieties — Infineon/BIT Excellence Program 2026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__brand">
        <svg class="app-header__logo" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--green)">
          <path d="M7 20h10"/>
          <path d="M10 20c5.5-2.5.8-6.4 3-10"/>
          <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/>
          <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>
        </svg>
        <div>
          <div class="app-header__title">Plants</div>
          <div class="app-header__subtitle">Manage your mango plants from nursery to harvest</div>
        </div>
      </div>
      <div class="app-header__farm">Banfora / Cascades Region, Burkina Faso</div>
    </header>

    <!-- Layout: sidebar + main -->
    <div class="app-layout">
      <!-- Sidebar nav -->
      <nav class="app-nav" aria-label="Main navigation">
        <a href="#" class="app-nav__link app-nav__link--active" id="nav-varieties">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M20.7 11A10 10 0 0 0 13 3.3V11h7.7z"/></svg>
          Varieties
        </a>
        <a href="#" class="app-nav__link" style="opacity:0.4;cursor:default" title="Coming soon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Growth Calendar
        </a>
        <a href="#" class="app-nav__link" style="opacity:0.4;cursor:default" title="Coming soon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22l1-1h3l9-9"/><path d="M3 21v-3l9-9"/><circle cx="18" cy="6" r="3"/></svg>
          Fertilizers
        </a>
        <a href="#" class="app-nav__link" style="opacity:0.4;cursor:default" title="Coming soon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Diseases
        </a>
        <a href="#" class="app-nav__link" style="opacity:0.4;cursor:default" title="Coming soon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          Harvest
        </a>
        <a href="#" class="app-nav__link" style="opacity:0.4;cursor:default" title="Coming soon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Nursery
        </a>
      </nav>

      <!-- Main content area -->
      <main class="main-content">
        <!-- Page header -->
        <div class="page-header">
          <h1 class="page-header__title">Variety Management</h1>
          <p class="page-header__subtitle">Task 1 — Track and manage mango variety selections across farm blocks</p>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar" id="filter-bar">
          <span class="filter-bar__label">Block / Plot:</span>
          <select class="filter-bar__select" id="filter-bloc">
            <option value="">All blocks</option>
            <!-- Options populated dynamically by app.js -->
          </select>
          <button class="filter-bar__btn" id="btn-clear-filter" type="button">Clear filter</button>
        </div>

        <!-- Table section — loading/error/empty/table states rendered here by JS -->
        <section id="table-section" class="fade-in">
          <!-- JS will render content here -->
        </section>
      </main>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" role="dialog" aria-labelledby="modal-title">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">Variety Details</h2>
        <button class="modal__close" id="modal-close" aria-label="Close" type="button">&times;</button>
      </div>
      <div class="modal__grid" id="modal-body">
        <!-- Populated by app.js -->
      </div>
    </div>
  </div>
</body>
</html>
