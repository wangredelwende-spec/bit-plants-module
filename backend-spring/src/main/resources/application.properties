# ============================================================
# Plants Module API — Spring Boot configuration
# Infineon/BIT Excellence Program 2026
# ============================================================

# --- Server ---
server.port=8080

# --- PostgreSQL datasource ---
# Credentials are loaded from application-local.properties (gitignored).
# Copy application-local.properties.example → application-local.properties
# and fill in your local values.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/plantsdb
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# validate: checks that the schema matches the entities — does NOT alter the DB.
# Run database/init.sql manually before starting the app.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- SpringDoc / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
